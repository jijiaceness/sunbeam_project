<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sunbeam Game</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!--players-->
        <img id="player" src="https://htmlhoster.com/p/V24GS21N/pixil-frame-0.png">
        <!--environment-->
        <img id="layer1" src="https://htmlhoster.com/p/VSSNR176/Untitled7_20260829130330%20(2).PNG" style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; z-index: 15;">
        <img id="bg" src="https://htmlhoster.com/p/8Z169XX4/Screenshot_29-8-2026_113458_hdwallsbox.com.jpeg" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; transition: opacity 0.5s;">
        <img id="sword" src="https://htmlhoster.com/p/7HPKWHFG/image-removebg-preview%20(13).png">
        <img id="monster" src="https://cdna.artstation.com/p/assets/images/images/078/094/398/original/martina-reynoso-sprite-minion-hchtelegoth.gif?1721174886">

        <!--dialogue-->
       <img id="dialogue1" src="https://htmlhoster.com/p/8A4GDEKH/IMG_0578-removebg-preview%202.png" style="display: none; position: fixed; top: 1200px; left: 520px; width: 520px; z-index: 998;">
<img id="dialogue2" src="https://htmlhoster.com/p/F0VG12AX/IMG_0578-removebg-preview%203%20(1).png" style="display: none; position: fixed; top: 1200px; left: 520px; width: 520px; z-index: 998;">
<img id="dialogue3" src="https://htmlhoster.com/p/PGY561MB/IMG_0578-removebg-preview%206.png" style="display: none; position: fixed; top: 1200px; left: 520px; width: 520px; z-index: 998;"><canvas id="canvas1"></canvas> <!--don't delete-->

        <script src="script.js"></script>
        <script>
        window.addEventListener('load', function() {
            window.sceneStep = 0;
            let bgElapsed = 0;

            const d1 = document.getElementById('dialogue1');
            const d2 = document.getElementById('dialogue2');
            const d3 = document.getElementById('dialogue3');
            const monster = document.getElementById('monster');
            const img = document.getElementById('bg');

            d1.style.display = 'block';

            setInterval(() => {
                bgElapsed += 100;

                if (bgElapsed > 10000 && window.sceneStep === 0) {
                    window.sceneStep = 1;
                    d1.style.display = 'none';
                    d2.style.display = 'block';
                    img.style.opacity = '0';
                    setTimeout(() => {
                        img.src = 'https://htmlhoster.com/p/J7TKC0V9/IMG_0557.jpg';
                        img.style.opacity = '1';
                    }, 500);
                }

                if (bgElapsed > 20000 && window.sceneStep === 1) {
                    window.sceneStep = 2;
                    d2.style.display = 'none';
                    d3.style.display = 'block';
                    monster.style.display = 'block';
                    img.style.opacity = '0';
                    setTimeout(() => {
                        img.src = 'https://i.pinimg.com/1200x/8a/8f/6e/8a8f6e92e0c128f34c510961a5db2ace.jpg';
                        img.style.opacity = '1';
                    }, 500);
                }

                if (bgElapsed > 30000 && window.sceneStep === 2) {
                    window.sceneStep = 3;
                    d3.style.display = 'none';
                    monster.style.display = 'none';
                    img.style.opacity = '0';
                    setTimeout(() => {
                        img.src = 'https://as1.ftcdn.net/v2/jpg/08/39/04/18/1000_F_839041845_zNjLiTYvkMeZcyAMdiWi0eE0lVbm1doy.jpg';
                        img.style.opacity = '1';
                    }, 500);
                }
            }, 100);
        });
        </script>
    </body>
</html>
