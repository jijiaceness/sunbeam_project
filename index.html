<img id="bg" src="https://htmlhoster.com/p/8Z169XX4/Screenshot_29-8-2026_113458_hdwallsbox.com.jpeg" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; transition: opacity 0.5s;">

<script>
document.addEventListener('scroll', () => {
    const img = document.getElementById('bg');
    if (window.scrollY + window.innerHeight >= document.body.scrollHeight) {
        img.style.opacity = '0';
        setTimeout(() => {
            img.src = 'https://via.placeholder.com/1920x1080/00ff00/ffffff?text=Background+2';
            img.style.opacity = '1';
        }, 500);
    }
});
</script>
